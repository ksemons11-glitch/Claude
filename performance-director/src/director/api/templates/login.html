{% extends "base.html" %}{% block content %}<div class="card" style="max-width:420px"><h2>Logowanie</h2>
{% if not login_enabled %}<p class="crit badge">APP_ADMIN_PASSWORD nie jest ustawione - logowanie wyłączone.</p>{% endif %}
{% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
<form method="post" action="/login"><label>Użytkownik <input name="username" required></label><br><br><label>Hasło <input name="password" type="password" required></label><br><br><button type="submit">Zaloguj</button></form></div>{% endblock %}
